[build-system]
requires = ["setuptools>=61.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "xblocks-extra"
dynamic = ["version"]
description = "A collection of XBlocks for the Open edX platform that preserve their original package paths for drop-in replacement"
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0"
authors = [
    {name = "Open edX Project", email = "oscm@openedx.org"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.2",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
keywords = [
    "Python",
    "edx",
    "xblock",
]
dependencies = [
    "XBlock",
    "Django>=4.2",
    "edx-codejail",
    "requests",
    "six"
]

[project.urls]
Homepage = "https://github.com/openedx/xblocks-extra"
Repository = "https://github.com/openedx/xblocks-extra"
Documentation = "https://xblocks-extra.readthedocs.io"

[project.optional-dependencies]
dev = [
    "build",
    "ruff",
]
test = [
    "edx-opaque-keys",
    "pytest>=7.0",
    "pytest-cov",
    "pytest-django",
    "coverage",
    "edx-lint",
    "edx-opaque-keys",
    "mock",
]
docs = [
    "sphinx",
    "sphinx-book-theme",
]

[project.entry-points."xblock.v1"]
audio = "audio:AudioXBlock"
imagemodal = "imagemodal.xblocks:ImageModal"
qualtricssurvey = "qualtricssurvey.xblocks:QualtricsSurvey"
sql_grader = "sql_grader:SqlGrader"
submit-and-compare = "submit_and_compare.xblocks:SubmitAndCompareXBlock"

# Packages live in src/ but are installed without the src prefix
# e.g., src/foo_xblock/ is installed as foo_xblock
[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["tests*", "*.tests", "*.tests.*"]

[tool.setuptools.package-data]
"*" = [
    "conf/**/*",
    "datasets/**/*",
    "public/**/*",
    "scenarios/**/*",
    "static/**/*",
    "templates/**/*",
    "translations/**/*",
]

# Ruff configuration
# https://docs.astral.sh/ruff/configuration/
[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "DJ",     # flake8-django
]
ignore = [
    "E501",   # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = []
known-third-party = ["django", "xblock"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# Pytest configuration
# https://docs.pytest.org/en/stable/reference/customize.html
[tool.pytest.ini_options]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
testpaths = ["tests", "src"]
addopts = "-v --tb=short"

# Coverage configuration
# https://coverage.readthedocs.io/en/latest/config.html
[tool.coverage.run]
branch = true
# Source paths will be added as xblocks are migrated
# Example: source = ["foo_xblock", "bar_xblock"]
source = ["sql_grader"]
omit = [
    "*/tests/*",
    "*/migrations/*",
    "*/__pycache__/*",
    "*/settings.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
fail_under = 70
show_missing = true

[tool.coverage.html]
directory = "htmlcov"

# Setuptools SCM configuration
# https://setuptools-scm.readthedocs.io/
[tool.setuptools_scm]
version_scheme = "only-version"
local_scheme = "no-local-version"

# Semantic Release configuration
# https://python-semantic-release.readthedocs.io/
[tool.semantic_release]
# Use SETUPTOOLS_SCM_PRETEND_VERSION to set version at build time since the
# build step happens before the repo gets tagged.
build_command = "pip install build && SETUPTOOLS_SCM_PRETEND_VERSION=$NEW_VERSION python -m build"
